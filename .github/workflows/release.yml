name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

# Tag pushes and manually published Releases share one publication queue.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            args: --mac dmg --arm64 --x64
            extension: dmg
          - platform: windows
            runner: windows-latest
            args: --win nsis --x64
            extension: exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install media tools
        if: matrix.platform == 'macos'
        run: brew install ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and test packaging on both platforms
        run: |
          npx tsc --noEmit -p packages/engine
          npx tsc --noEmit -p packages/cli
          npm run typecheck -w onset-desktop
          npm run test:packaging -w onset-desktop
      # Windows engine/CLI tests remain report-only in CI until the port is complete.
      - name: Engine and CLI tests
        if: matrix.platform == 'macos'
        run: |
          npx vitest run --root packages/engine
          npx vitest run --root packages/cli
      - name: Build with the release version
        run: |
          [[ "$RELEASE_TAG" == v* ]] || { echo 'Release tag must start with v' >&2; exit 1; }
          version="${RELEASE_TAG#v}"
          npm version "$version" --no-git-tag-version --allow-same-version -w onset-desktop
          ONSET_VERSION="$version" npm run build -w @onset/cli
          npm run vendor -w onset-desktop
          npm run build -w onset-desktop
      # No signing certificates yet: macOS and Windows artifacts are unsigned.
      - name: Package desktop
        working-directory: apps/desktop
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.platform }}
          path: apps/desktop/release/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish all installers
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: installers
      - name: Verify artifacts and publish
        working-directory: installers
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          files=("OnSet-${version}-arm64.dmg" "OnSet-${version}-x64.dmg" "OnSet-${version}-windows-x64-setup.exe")
          for file in "${files[@]}"; do
            test -s "$file" || { echo "Missing installer: $file" >&2; exit 1; }
          done
          sha256sum "${files[@]}" > checksums.txt
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" checksums.txt --clobber
          else
            flags=()
            if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${files[@]}" checksums.txt --verify-tag --generate-notes --title "片场 OnSet $RELEASE_TAG" "${flags[@]}"
          fi
