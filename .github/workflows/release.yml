name: Release

on:
  # Manual runs build downloadable test installers without publishing a Release.
  workflow_dispatch:
  push:
    tags: ['v*']
  release:
    types: [published]

# Tag pushes and manually published Releases share one publication queue.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v0.0.0-test.{0}', github.run_number) || github.event.release.tag_name || github.ref_name }}

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            # zip 是给自动更新的（Squirrel.Mac 只认 zip），dmg 给第一次下载安装。
            args: --mac dmg zip --arm64 --x64
          - platform: windows
            runner: windows-latest
            args: --win nsis --x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
      # Check before installing dependencies or running the test suites.
      - name: Check macOS signing credentials
        if: matrix.platform == 'macos'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${CSC_LINK:?Missing MAC_CSC_LINK; see docs/macos-signing.md}"
          : "${CSC_KEY_PASSWORD:?Missing MAC_CSC_KEY_PASSWORD}"
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install media tools
        if: matrix.platform == 'macos'
        run: brew install ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and test packaging on both platforms
        run: |
          npx tsc --noEmit -p packages/engine
          npx tsc --noEmit -p packages/cli
          npm run typecheck -w onset-desktop
          npm run test:packaging -w onset-desktop
      # Windows engine/CLI tests remain report-only in CI until the port is complete.
      - name: Engine and CLI tests
        if: matrix.platform == 'macos'
        run: |
          npx vitest run --root packages/engine
          npx vitest run --root packages/cli
      - name: Build with the release version
        run: |
          [[ "$RELEASE_TAG" == v* ]] || { echo 'Release tag must start with v' >&2; exit 1; }
          version="${RELEASE_TAG#v}"
          npm version "$version" --no-git-tag-version --allow-same-version -w onset-desktop
          ONSET_VERSION="$version" npm run build -w @onset/cli
          npm run vendor -w onset-desktop
          npm run build -w onset-desktop
      - name: Package signed macOS desktop
        if: matrix.platform == 'macos'
        timeout-minutes: 60
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          npx electron-builder ${{ matrix.args }} --publish never
          -c.forceCodeSigning=true -c.mac.notarize=true
      - name: Verify macOS signing and notarization
        if: matrix.platform == 'macos'
        working-directory: apps/desktop
        run: |
          for app in "release/mac-arm64/片场.app" "release/mac/片场.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --verbose --type execute "$app"
            xcrun stapler validate "$app"
          done
      # 自动更新下载的是 zip：解开再验一遍，zip 里的应用没有公证票据时用户点更新会失败。
      - name: Verify macOS update archives
        if: matrix.platform == 'macos'
        working-directory: apps/desktop/release
        run: |
          version="${RELEASE_TAG#v}"
          for arch in arm64 x64; do
            zip="OnSet-${version}-${arch}.zip"
            test -s "$zip" || { echo "Missing update archive: $zip" >&2; exit 1; }
            grep -q "$zip" latest-mac.yml || { echo "latest-mac.yml does not list $zip" >&2; exit 1; }
            dir="$(mktemp -d)"
            ditto -x -k "$zip" "$dir"
            codesign --verify --deep --strict --verbose=2 "$dir/片场.app"
            spctl --assess --verbose --type execute "$dir/片场.app"
            xcrun stapler validate "$dir/片场.app"
            rm -rf "$dir"
          done
      # Windows signing uses a separate certificate and is not configured yet.
      - name: Package Windows desktop
        if: matrix.platform == 'windows'
        working-directory: apps/desktop
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.platform }}
          # 安装包、自动更新用的 zip、差分下载的 blockmap 与更新元数据（latest-mac.yml / latest.yml）。
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish all installers
    if: github.event_name != 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: installers
      - name: Verify artifacts and publish
        working-directory: installers
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          installers=("OnSet-${version}-arm64.dmg" "OnSet-${version}-x64.dmg" "OnSet-${version}-windows-x64-setup.exe")
          # 客户端自动更新读 latest-mac.yml / latest.yml，再按里面的文件名下载 zip / exe，blockmap 用来差分下载。
          updates=("OnSet-${version}-arm64.zip" "OnSet-${version}-x64.zip" latest-mac.yml latest.yml)
          for file in "${installers[@]}" "${updates[@]}"; do
            test -s "$file" || { echo "Missing release file: $file" >&2; exit 1; }
          done
          grep -q "^version: ${version}$" latest-mac.yml || { echo "latest-mac.yml is not for ${version}" >&2; exit 1; }
          grep -q "^version: ${version}$" latest.yml || { echo "latest.yml is not for ${version}" >&2; exit 1; }
          shopt -s nullglob
          blockmaps=(*.blockmap)
          files=("${installers[@]}" "${updates[@]}" "${blockmaps[@]}")
          sha256sum "${installers[@]}" "OnSet-${version}-arm64.zip" "OnSet-${version}-x64.zip" > checksums.txt
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" checksums.txt --clobber
          else
            flags=()
            if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${files[@]}" checksums.txt --verify-tag --generate-notes --title "片场 OnSet $RELEASE_TAG" "${flags[@]}"
          fi
