name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test the engine, CLI and desktop client
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # 引擎的集成测试要真实的 ffmpeg / ffprobe / rsvg-convert；缺了会跳过，覆盖就成了假的。
      - name: Install media tools
        run: brew install ffmpeg librsvg
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p packages/engine
      - run: npx tsc --noEmit -p packages/cli
      - run: npm run typecheck -w am-desktop
      - run: npx vitest run --root packages/engine
      - run: npx vitest run --root packages/cli
      - run: npm run build -w @am/cli
      - run: npm run build -w am-desktop

  generated-assets:
    name: Generator reproduces the committed assets
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @am/engine
      - name: assets/presets 与 assets/styles 必须与画幅表、风格表、模板一致
        run: |
          if ! git diff --exit-code; then
            echo "::error::生成产物与提交的不一致：改了画幅表、风格表或模板后要跑 npm run generate -w @am/engine 并提交产物" >&2
            exit 1
          fi

  e2e:
    name: Desktop client end-to-end (Playwright, Electron)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install media tools
        run: brew install ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npm run test:e2e -w am-desktop
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: apps/desktop/test-results
          retention-days: 7
