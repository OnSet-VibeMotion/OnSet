name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- TypeScript + Electron（改写中；切换后取代下面的 Go 任务） ----
  typescript:
    name: TypeScript engine, CLI and desktop client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # engine 的集成测试要真实的 ffmpeg / ffprobe / rsvg-convert；缺了会跳过，覆盖就成了假的。
      - name: Install media tools
        run: brew install ffmpeg librsvg
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p packages/engine
      - run: npx tsc --noEmit -p packages/cli
      - run: npm run typecheck -w am-desktop
      - run: npx vitest run --root packages/engine
      - run: npx vitest run --root packages/cli
      - run: npm run build -w @am/cli
      - run: npm run build -w am-desktop

  ts-generated-assets:
    name: TS generator reproduces the committed assets
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @am/engine
      - name: assets/presets 与 assets/styles 必须与画幅表、风格表一致
        run: git diff --exit-code

  parity:
    name: TS am matches the Go am byte-for-byte
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install media tools
        run: brew install ffmpeg librsvg
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @am/cli
      - run: go build -o "$RUNNER_TEMP/am" ./cmd/am
      - name: Dual-run comparison
        env:
          AM_GO: ${{ runner.temp }}/am
        run: node scripts/parity/run.mjs

  studio-ui:
    name: Studio UI build is committed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/studio/ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/studio/ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      # internal/studio/web 是 go:embed 进二进制的构建产物，必须与 ui/src 一致。
      - name: Verify committed build output
        run: git diff --exit-code -- ../web && test -z "$(git status --porcelain -- ../web)"

  studio-e2e:
    name: Studio browser E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/studio/ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/studio/ui/package-lock.json
      - name: Install Playwright
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run Studio browser flow
        env:
          AM_STUDIO_E2E_CONFIG: ${{ runner.temp }}/am-studio-projects.json
        run: npm run test:e2e

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      # mediaprobe / concat 的集成测试要真实的 ffmpeg 和 ffprobe。
      # 不装的话它们会自行跳过——测试仍然"通过"，但覆盖率会掉到门禁线以下，
      # 而且真正在跑外部命令的那部分代码就再没被验证过。
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      - run: ffmpeg -version | head -1
      - run: go test -race ./...

  generated-assets:
    name: generated assets are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      # 只重跑文本产物。示例 PNG 在 -examples 开关后面，不参与这道门：
      # 不同版本的 rsvg-convert 输出字节不同，纳进来会让门随 runner 随机失败。
      - run: go generate ./internal/preset/
      - name: assets/presets 与 assets/styles 必须与画幅表、风格表一致
        run: git diff --exit-code

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Module tidiness
        run: go mod tidy && git diff --exit-code
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...
      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Coverage
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out
          go tool cover -func=coverage.out | awk '/total:/ { gsub("%", "", $3); if ($3 + 0 < 80) exit 1 }'
      - name: Cross-build release targets
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/am-${os}-${arch}" ./cmd/am
          done
