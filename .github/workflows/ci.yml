name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test the engine, CLI and desktop client
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # 引擎的集成测试要真实的 ffmpeg / ffprobe；缺了会跳过，覆盖就成了假的。
      - name: Install media tools
        run: brew install ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p packages/engine
      - run: npx tsc --noEmit -p packages/cli
      - run: npm run typecheck -w onset-desktop
      - run: npm run test:packaging -w onset-desktop
      - run: npx vitest run --root packages/engine
      - run: npx vitest run --root packages/cli
      - run: npm run build -w @onset/cli
      - run: npm run build -w onset-desktop

  windows:
    # 客户端还没移植到 Windows（见 AGENTS.md「Windows」）。这一项先让问题暴露出来：类型检查与构建必须通过，
    # 两包的单元测试照跑、失败不挡合并，等移植完再去掉 continue-on-error。
    name: Windows (typecheck, build; tests report only)
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p packages/engine
      - run: npx tsc --noEmit -p packages/cli
      - run: npm run typecheck -w onset-desktop
      - run: npm run test:packaging -w onset-desktop
      - run: npm run build -w @onset/cli
      - run: npm run build -w onset-desktop
      - name: Engine unit tests (not yet expected to pass)
        continue-on-error: true
        run: npx vitest run --root packages/engine --reporter=default --reporter=junit --outputFile.junit=engine-junit.xml
      - name: CLI unit tests (not yet expected to pass)
        continue-on-error: true
        run: npx vitest run --root packages/cli --reporter=default --reporter=junit --outputFile.junit=cli-junit.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-test-reports
          path: |
            packages/engine/engine-junit.xml
            packages/cli/cli-junit.xml
          retention-days: 7
          if-no-files-found: ignore

  generated-assets:
    name: Generator reproduces the committed assets
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run generate -w @onset/engine
      - name: assets/presets 必须与画幅表、模板一致
        run: |
          if ! git diff --exit-code; then
            echo "::error::生成产物与提交的不一致：改了画幅表或 frame.md 模板后要跑 npm run generate -w @onset/engine 并提交产物" >&2
            exit 1
          fi

  e2e:
    name: Desktop client end-to-end (Playwright, Electron)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install media tools
        run: brew install ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npm run test:e2e -w onset-desktop
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: apps/desktop/test-results
          retention-days: 7
