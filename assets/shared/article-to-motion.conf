# ArticleToMotion 工具配置
# 取值优先级：环境变量 > .env > 本文件 > 内置默认
# 编排工具：codex | claude | qoder | codebuddy | opencode
ORCHESTRATOR=codex
# 渲染工具：codex | claude | qoder | codebuddy | opencode（可与 ORCHESTRATOR 相同）
RENDERER=claude
# TTS 工具：minimax | bailian | edge | elevenlabs | tencent | mlx（完整制作流程需要）
# mlx 仅限 Apple Silicon；edge 免鉴权但无服务承诺，适合预览
TTS_PROVIDER=minimax
# 已知文本强制对齐：auto | mlx | funasr
# auto 在 Apple Silicon 上用 mlx，其余平台用 funasr
ALIGN_PROVIDER=auto
# 镜头并发数：1-16，默认 3
SCENE_JOBS=3
# 渲染记忆：on | off，默认 on（off 时完全不召回、不写经历，也不给编排工具用户偏好）。记忆库默认在 ~/.local/share/am/memory，
# 可用环境变量 AM_MEMORY_DIR 指定；详见 am memory --help
MEMORY=on
# 召回所依据的记忆库快照号；留空跟随最新快照，写上快照号就钉住
MEMORY_SNAPSHOT=
# 每个镜头召回的记忆总字数上限
MEMORY_RECALL_BUDGET=1500
# 正式渲染时探索的镜头比例（0–0.5）：把召回里排最后的一条经验换成排在上限外的第一条，
# 给没机会被召回的经验攒样本；镜头是否过期不受影响。0 关闭
MEMORY_EXPLORE=0.1
