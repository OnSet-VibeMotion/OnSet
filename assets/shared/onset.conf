# 片场工具配置
# 取值优先级：环境变量 > .env > 本文件 > 客户端「设置」页的全局设置 > 内置默认
# 编排、渲染、配音、对齐、并发与记忆这几项留空时跟随全局设置（所有项目共用）；写了就只对这个项目生效
# 编排工具：codex | claude | qoder | codebuddy | opencode | director（导演，在客户端设置里填模型服务的 API key 就能用）
ORCHESTRATOR=
# 编排工具用的模型，留空用那家工具自己的默认；写的是那家认的模型名（claude 的 opus、codex 的 gpt-6.1-sol……）
# 只在与 ORCHESTRATOR 同一处（或更靠前的一处）写的才算：换了工具，给原来那家写的模型不会带过去
ORCHESTRATOR_MODEL=
# 渲染工具：codex | claude | qoder | codebuddy | opencode（可与 ORCHESTRATOR 相同；director 暂时只能做编排）
RENDERER=
# 渲染工具用的模型，规则同 ORCHESTRATOR_MODEL
RENDERER_MODEL=
# 润色输入框里的话、检查镜头画面描述用的工具：留空跟随编排工具，可选值同 ORCHESTRATOR
OPTIMIZER=
# 润色与检查用的模型，规则同 ORCHESTRATOR_MODEL；OPTIMIZER 留空时跟随编排模型
OPTIMIZER_MODEL=
# TTS 工具：minimax | bailian | edge | elevenlabs | tencent | mlx | breeze（完整制作流程需要）
# mlx、breeze 仅限 Apple Silicon；edge 免鉴权但无服务承诺，适合预览
# 全局设置也没写时：Apple Silicon 上默认 breeze（本机离线），其余平台默认 minimax
TTS_PROVIDER=
# 已知文本强制对齐：auto | mlx | funasr
# auto 在 Apple Silicon 上用 mlx，其余平台用 funasr
ALIGN_PROVIDER=
# 镜头并发数：1-16，默认 3
SCENE_JOBS=
# 安全模式下编排工具额外放行的命令前缀，逗号分隔，例如 uv run, pnpm, magick；默认清单见 README「安全模式」
ORCHESTRATOR_ALLOW_COMMANDS=
# 自动批准：on | off。客户端里编排工具要跑白名单外的命令时，on 直接允许、不再弹卡片问；留空跟随全局设置（默认 off）
AUTO_APPROVE=
# 渲染记忆：on | off，默认 on（off 时完全不召回、不写经历，也不给编排工具用户偏好）。记忆库默认在 ~/.local/share/onset/memory，
# 可用环境变量 ONSET_MEMORY_DIR 指定；详见 onset memory --help
MEMORY=
# 召回所依据的记忆库快照号；留空跟随最新快照，写上快照号就钉住
MEMORY_SNAPSHOT=
# 每个镜头召回的记忆总字数上限
MEMORY_RECALL_BUDGET=1500
# 正式渲染时探索的镜头比例（0–0.5）：把召回里排最后的一条经验换成排在上限外的第一条，
# 给没机会被召回的经验攒样本；镜头是否过期不受影响。0 关闭
MEMORY_EXPLORE=0.1
